name: Social — post next reel
on:
  schedule:
    - cron: "0 14 * * *"     # 14:00 UTC = 18:00 Dubai, one reel per run
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print only, post nothing)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: social-post
jobs:
  post:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_API_BASE: ${{ vars.IG_API_BASE }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Post next reel
        run: python social/post_reel.py
      - name: Commit manifest
        if: env.DRY_RUN == '0'
        run: |
          git config user.name "oneprice-bot"
          git config user.email "oneprice.series@gmail.com"
          git add social/reels_manifest.json
          git diff --cached --quiet || git commit -m "manifest: mark posted [skip ci]"
          git push
